# Local development database only. Not a production deployment.
services:
  db:
    image: postgres:16-alpine
    container_name: 3dcars-pg
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_only
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - atlas-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  atlas-pg:
